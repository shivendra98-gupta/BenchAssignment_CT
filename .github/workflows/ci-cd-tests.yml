name: SauceDemo Selenium Test Automation CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'TestNG Suite File to Execute'
        required: false
        default: 'src/test/resources/runners/testng.xml'

jobs:
  test-execution:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Set up Google Chrome Browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: latest

      - name: Verify Environment & Tools
        run: |
          java -version
          mvn -version
          google-chrome --version

      - name: Run Selenium TestNG Automation Suite
        run: |
          mvn clean test \
            -DsuiteXmlFile="${{ github.event.inputs.suite || 'src/test/resources/runners/testng.xml' }}" \
            -Dbrowser=chrome \
            -Dheadless=true

      - name: Upload Extent Reports Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extent-test-reports
          path: reports/
          retention-days: 14

      - name: Upload Screenshots on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-screenshots
          path: screenshots/
          retention-days: 14

      - name: Upload Execution Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-logs
          path: logs/
          retention-days: 7
